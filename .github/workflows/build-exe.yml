# Сборка exe для демо на Windows.
# Результат — артефакт WeldingPortal-windows: папка с WeldingPortal.exe.
# Запуск: при пуше в main или вручную — Actions → «Сборка exe» → Run workflow.

name: Сборка exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Собрать фронт
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Положить фронт туда, откуда его отдаёт Django
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/static | Out-Null
          Copy-Item -Recurse frontend/dist backend/static/spa

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-desktop.txt

      - name: Зависимости
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-desktop.txt

      - name: Статика админки
        working-directory: backend
        env:
          DEBUG: "0"
          SECRET_KEY: build-only
          DB_ENGINE: sqlite
        run: python manage.py collectstatic --noinput

      - name: Собрать exe
        working-directory: backend
        run: pyinstaller desktop.spec --noconfirm

      # проверка: exe поднимается, наполняет базу и отдаёт портал и API
      - name: Проверить запуск
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\portal-check"
          $proc = Start-Process backend/dist/WeldingPortal/WeldingPortal.exe -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" `
            -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            try {
              $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
              $login = Invoke-RestMethod http://127.0.0.1:8765/api/auth/login/ -Method Post -ContentType 'application/json' -Body '{"login":"admin","password":"admin"}'
              if ($page.StatusCode -eq 200 -and $login.token) { $ok = $true; break }
            } catch {}
          }
          Write-Host "--- exited: $($proc.HasExited)  exit code: $($proc.ExitCode) ---"
          Write-Host "--- stdout ---"
          Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"
          Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) { Stop-Process $proc -Force }
          if (-not $ok) { throw "Портал не поднялся" }

      - uses: actions/upload-artifact@v4
        with:
          name: WeldingPortal-windows
          path: backend/dist/WeldingPortal
          retention-days: 30
