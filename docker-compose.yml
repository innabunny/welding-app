services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: welding
      POSTGRES_USER: welding
      POSTGRES_PASSWORD: welding
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welding"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: welding
      DB_USER: welding
      DB_PASSWORD: welding
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: