services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: welding
      POSTGRES_USER: welding
      POSTGRES_PASSWORD: welding
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welding"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: welding
      DB_USER: welding
      DB_PASSWORD: welding
      REDIS_HOST: redis 
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

    command: >
      sh -c "python manage.py migrate && 
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"  
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy  

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_USE_POLLING: "1"
    volumes:
      - ./frontend:/app
      # node_modules остаются из образа: собранные под Linux, а не под macOS
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqttdata:/mosquitto/data  

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: welding
      CLICKHOUSE_USER: welding
      CLICKHOUSE_PASSWORD: welding
      # без этого ClickHouse не даст пользователю создавать таблицы
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - chdata:/var/lib/clickhouse
      # файлы отсюда выполняются один раз при первом старте
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"   # HTTP — сюда ходит Python и DBeaver
      - "9000:9000"   # нативный протокол
    ulimits:
      # ClickHouse держит много открытых файлов, лимит по умолчанию мал
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      retries: 10
 
  collector:
    build: ./collector
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      DB_HOST: db
      DB_NAME: welding
      DB_USER: welding
      DB_PASSWORD: welding
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DB: welding
      CH_USER: welding
      CH_PASSWORD: welding
      DJANGO_SETTINGS_MODULE: config.settings
      REDIS_HOST: redis
    volumes:
      - ./collector:/app
      # модели берём из бэкенда, чтобы не дублировать описание таблиц
      - ./backend:/backend
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mqtt:
        condition: service_started
      redis: 
        condition: service_healthy  
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    # шина между процессами: приёмник телеметрии кладёт сообщение,
    # веб-сервер раздаёт его открытым браузерам
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  mqttdata:
  chdata: